name: Update Dogshell Formula

on:
  schedule:
    - cron: "0 8 * * 1"  # Weekly on Monday at 8am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and update formula
        id: update
        run: python3 .github/update_formula.py

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dogshell.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update dogshell to ${{ steps.update.outputs.version }}"
          git push
